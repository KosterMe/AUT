server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The library takes whole b-roll clips, and the API accepts up to
    # AUTOCLIPS_INSERTS_MAX_UPLOAD_MB (200 by default). At nginx's 1 MB default
    # — and at the 8 MB this used to carry, which was sized for cookie jars —
    # every video upload died here with a bare HTML 413 that never reached the
    # API, so the app's own limit and its readable error never applied. Keep
    # this above that setting; the headroom is multipart framing.
    client_max_body_size 220m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Downloading and transcribing a source takes minutes; the default 60s
        # read timeout would cut a slow request off mid-flight.
        proxy_read_timeout 600s;
    }

    # Uploading a fragment: hand the bytes to the API as they arrive instead of
    # spooling a couple of hundred megabytes to this container's disk first.
    location = /api/assets {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
    }

    # Clip previews and library assets are whole media files. Buffering them to
    # disk first adds latency and disk churn for no benefit, so stream them
    # straight through — and pass Range through untouched, which is what lets
    # the browser seek in a preview instead of fetching the file to play it.
    location ~ ^/api/(clips/[0-9]+/(video|cover)|assets/[0-9]+/file)$ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}
