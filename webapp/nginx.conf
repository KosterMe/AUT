server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Exported cookie jars run to a few hundred KB; nginx's 1 MB default would
    # reject some of them with a bare 413.
    client_max_body_size 8m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Downloading and transcribing a source takes minutes; the default 60s
        # read timeout would cut a slow request off mid-flight.
        proxy_read_timeout 600s;
    }

    # Clip previews are whole video files. Buffering them to disk first adds
    # latency and disk churn for no benefit, so stream them straight through.
    location ~ ^/api/clips/[0-9]+/(video|cover)$ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}
